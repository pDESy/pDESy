name: visualization test

on: [push, pull_request]

jobs:
  visualization:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv sync --extra vis --group dev
    - name: Check Chromium/Chrome version
      run: |
        if command -v chromium-browser >/dev/null 2>&1; then
          chromium-browser --version
        elif command -v chromium >/dev/null 2>&1; then
          chromium --version
        elif command -v google-chrome >/dev/null 2>&1; then
          google-chrome --version
        else
          echo "No Chromium/Chrome binary found; continuing without a version check."
        fi
    - name: Test visualization with pytest
      run: |
        uv run pytest tests/visualization --cov=tests/visualization --cov-report=xml
